<ion-content [fullscreen]="true" class="splash-content">
  <div class="bg-orb orb-left" aria-hidden="true"></div>
  <div class="bg-orb orb-right" aria-hidden="true"></div>

  <div class="splash-shell">
    <div class="brand-mark">
      <div class="logo-wrap">
        <img src="assets/icon/favicon.png" alt="PDF to Word" class="logo-image" />
      </div>

      <div class="spark spark-one" aria-hidden="true"></div>
      <div class="spark spark-two" aria-hidden="true"></div>
    </div>

    <div class="brand-copy">
      <span class="eyebrow">SMART DOCUMENT CONVERTER</span>
      <h1>PDF to Word</h1>
      <p>Preparing your workspace...</p>
    </div>

    <div class="loader-block" aria-hidden="true">
      <div class="loader-track">
        <span class="loader-bar"></span>
      </div>
      <span class="loader-caption">Loading home screen</span>
    </div>
  </div>
</ion-content>
